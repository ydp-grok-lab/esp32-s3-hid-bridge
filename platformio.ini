; ESP32-S3 N8R8 USB HID Bridge
; Flash: 8MB QIO, PSRAM: 8MB OPI
; Native USB-OTG (TinyUSB) presents as HID mouse+keyboard to the host.
; Uses pioarduino / Arduino-ESP32 3.x for USBHIDAbsoluteMouse + USBHIDKeyboard.

[env:esp32-s3-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0

monitor_speed = 115200
upload_speed = 921600


; ---------------------------------------------------------------------------
; Simulation / host-test environments (do not affect the real firmware env).
; See docs/WOKWI.md
; ---------------------------------------------------------------------------

; Firmware for the Wokwi simulator (wokwi.com, Wokwi for VS Code, wokwi-cli).
; Differences vs. esp32-s3-n8r8:
;  - HID_STUB: Wokwi has no USB-OTG device/HID simulation -> HID calls are logged.
;  - ARDUINO_USB_MODE=1 + CDC_ON_BOOT: Serial = USB-Serial-JTAG (HWCDC), the only
;    USB serial Wokwi simulates ("serialInterface": "USB_SERIAL_JTAG").
;  - STA to the virtual open AP "Wokwi-GUEST" (SoftAP cannot be reached in Wokwi).
;  - WOKWI_SELFTEST: the firmware calls its own HTTP API over loopback and prints
;    PASS/FAIL lines (wokwi-cli has no port forwarding).
;  - merge_firmware.py: builds firmware.merged.bin (bootloader+partitions+app, 8MB).
[env:wokwi]
extends = env:esp32-s3-n8r8
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DHID_STUB
  -DWOKWI_SELFTEST
  -DWIFI_STA_SSID=\"Wokwi-GUEST\"
  -DWIFI_STA_PASSWORD=\"\"
  -DWIFI_STA_CHANNEL=6
extra_scripts = post:merge_firmware.py

; Host-side unit tests of the JSON/op logic + HID op sequencing (no hardware, no
; Wokwi, no token):  pio run -e native -t exec     (or: sh host_test/run.sh)
[env:native]
platform = native
build_flags =
  -std=gnu++17
  -Wall
  -DHID_STUB
  -DNATIVE_TEST
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -I$PROJECT_DIR/host_test/shim
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
build_src_filter =
  -<*>
  +<action_handler.cpp>
  +<hid_actions.cpp>
  +<../host_test/test_main.cpp>
lib_ldf_mode = deep+
